{% extends "portfolio/base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 50px auto; text-align: center; border: 1px solid #fee2e2; padding: 30px; border-radius: 8px;">
    <h2 style="color: #ef4444;">Tens a certeza?</h2>
    <p>Estás prestes a apagar o artigo: <strong>{{ artigo.titulo }}</strong>. Esta ação não pode ser desfeita.</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="padding: 10px 20px; background: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Sim, Apagar Definitivamente
        </button>
        <a href="{% url 'artigo_detalhe' artigo.id %}" style="margin-left: 15px; color: #6b7280;">Cancelar</a>
    </form>
</div>
{% endblock %}
